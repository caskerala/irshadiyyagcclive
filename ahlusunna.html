<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ഓൺലൈൻ ക്ലാസുകൾ (YouTube Player)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    nav {
      background: #1e293b;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    nav h1 {
      font-size: 1.25rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .free-badge {
      background: #10b981;
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Main Container */
    .main-container {
      display: flex;
      flex: 1;
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      gap: 20px;
    }

    /* Video Section */
    .video-section {
      flex: 2.2;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .player-box {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      padding-bottom: 56.25%; /* 16:9 ratio */
      height: 0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .player-box iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ടൈറ്റിലിൽ തൊട്ട് യൂട്യൂബിലേക്ക് പോകാതിരിക്കാനുള്ള സുതാര്യമായ ഷീൽഡ് */
    .yt-top-shield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      z-index: 5;
      background: transparent;
      cursor: default;
    }

    .video-details {
      background: #1e293b;
      padding: 16px 20px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .video-details h2 {
      font-size: 1.15rem;
      color: #f1f5f9;
    }

    .nav-btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 8px 16px;
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .btn:hover:not(:disabled) {
      background: #0284c7;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ലളിതമായ പ്ലേലിസ്റ്റ് */
    .playlist-section {
      flex: 1;
      background: #1e293b;
      border-radius: 12px;
      padding: 18px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      max-height: 75vh;
    }

    .playlist-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 15px;
      color: #38bdf8;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }

    .class-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 5px;
    }

    .class-item {
      padding: 12px 14px;
      background: #0f172a;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #cbd5e1;
      font-size: 0.9rem;
      border: 1px solid transparent;
      transition: 0.2s;
    }

    .class-item:hover {
      background: #1e293b;
      border-color: #38bdf8;
    }

    .class-item.active {
      background: #0369a1;
      color: #fff;
      border-color: #38bdf8;
    }

    .class-number {
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    @media (max-width: 900px) {
      .main-container {
        flex-direction: column;
      }
      .playlist-section {
        max-height: 400px;
      }
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- Header -->
  <nav>
    <h1>🎓 ഓൺലൈൻ ക്ലാസ്സ് റൂം</h1>
    <span class="free-badge">മാല മൌലിദ് </span>
  </nav>

  <div class="main-container">
    <!-- വീഡിയോ പ്ലെയർ -->
    <div class="video-section">
      <div class="player-box">
        <iframe 
          id="ytFrame" 
          src="" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
        <!-- ടൈറ്റിൽ ക്ലിക്ക് തടയുന്ന ഷീൽഡ് -->
        <div class="yt-top-shield"></div>
      </div>

      <div class="video-details">
        <h2 id="videoTitle">ക്ലാസ് വിവരങ്ങൾ...</h2>
        <div class="nav-btn-group">
          <button id="prevBtn" class="btn" onclick="prevVideo()">◀ മുൻപത്തെ ക്ലാസ്</button>
          <button id="nextBtn" class="btn" onclick="nextVideo()">അടുത്ത ക്ലാസ് ▶</button>
        </div>
      </div>
    </div>

    <!-- ക്ലാസ് ലിസ്റ്റ് -->
    <div class="playlist-section">
      <div class="playlist-title">എല്ലാ ക്ലാസുകളും</div>
      <div class="class-list" id="classListContainer"></div>
    </div>
  </div>

  <script>
    // ===============================================================
    // നിങ്ങളുടെ YouTube വീഡിയോകളുടെ 11 അക്ഷരങ്ങളുള്ള ID നൽകുക
    // (ഉദാ: https://youtu.be/M7lc1UVf-VE എന്നതിൽ M7lc1UVf-VE ആണ് ID)
    // ===============================================================
    const videoList = [
      { id: "vKeXnVFZUh8", title: "മാല മൌലിദ് : ക്ലാസ്സ്‌ 26" },
      { id: "zE01B7ODcPU", title: "മാല മൌലിദ് : ക്ലാസ്സ്‌ 27" },
      { id: "xAkOoOMD6QA", title: "മാല മൌലിദ് : ക്ലാസ്സ്‌ 28" },
      { id: "NXHoTtYmuuI", title: "മാല മൌലിദ് : ക്ലാസ്സ്‌ 29" },
      { id: "3JZ_D3E", title: "മാല മൌലിദ് : ക്ലാസ്സ്‌ 30" },
      { id: "RgKAFK5", title: "മാല മൌലിദ് : ക്ലാസ്സ്‌ 31" }
      // കൂടുതൽ ക്ലാസുകൾ വേണമെങ്കിൽ താഴേക്ക് { id: "...", title: "..." } ചേർക്കാം
    ];

    let currentIndex = 0;

    // ക്ലാസ് ലിസ്റ്റ് റെൻഡർ ചെയ്യുന്നു
    function renderList() {
      const container = document.getElementById("classListContainer");
      container.innerHTML = "";

      videoList.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = `class-item ${index === currentIndex ? 'active' : ''}`;
        div.onclick = () => loadVideo(index);

        div.innerHTML = `
          <span class="class-number">${index + 1}</span>
          <span>${item.title}</span>
        `;
        container.appendChild(div);
      });
    }

    // വീഡിയോ മാറ്റുന്ന ഫംഗ്ഷൻ
    function loadVideo(index) {
      currentIndex = index;
      const video = videoList[index];

      // YouTube Embed URL (No download, related videos from same channel only)
      const ytEmbedUrl = `https://www.youtube-nocookie.com/embed/${video.id}?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3`;
      
      document.getElementById("ytFrame").src = ytEmbedUrl;
      document.getElementById("videoTitle").innerText = video.title;

      document.getElementById("prevBtn").disabled = (currentIndex === 0);
      document.getElementById("nextBtn").disabled = (currentIndex === videoList.length - 1);

      renderList();
    }

    function nextVideo() {
      if (currentIndex < videoList.length - 1) loadVideo(currentIndex + 1);
    }

    function prevVideo() {
      if (currentIndex > 0) loadVideo(currentIndex - 1);
    }

    // പേജ് തുറക്കുമ്പോൾ ആദ്യ ക്ലാസ് നേരിട്ട് പ്ലേ ചെയ്യുന്നു
    renderList();
    loadVideo(0);
  </script>
</body>
</html>
